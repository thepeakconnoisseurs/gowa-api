services:
  whatsapp_go:
    container_name: gowa-api
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    build:
      context: .
      dockerfile: ./docker/golang.Dockerfile
      tags:
        - "gowa-api:latest"
    restart: "on-failure"
    ports:
      - "127.0.0.1:3500:3000"
    env_file:
      - src/.env
    networks:
      - n8n-tpc
      - gowa-api
    volumes:
      # Persist WhatsApp + chat DBs; entrypoint chowns for gowauser (uid 20001, gid 20000) on start.
      - ./storages:/app/storages
      - ./statics:/app/statics

networks:
  n8n-tpc:
    external: true
  gowa-api:
    name: gowa-api
    driver: bridge
