services:
  whatsapp_go:
    container_name: gowa-api
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Custom image built by CI (.github/workflows/build-custom-dockerhub.yaml) and pushed
    # to Docker Hub as peakwine/gowa-api. Never built locally anymore.
    image: peakwine/gowa-api:latest
    pull_policy: always
    restart: "on-failure"
    ports:
      - "127.0.0.1:3500:3000"
    env_file:
      - src/.env
    networks:
      - n8n-tpc
      - gowa-api
    volumes:
      # Persist WhatsApp + chat DBs; entrypoint chowns for gowauser (uid 20001, gid 20000) on start.
      - ./storages:/app/storages
      - ./statics:/app/statics

networks:
  n8n-tpc:
    external: true
  gowa-api:
    name: gowa-api
    driver: bridge
